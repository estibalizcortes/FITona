# Blueprint de Render (plan gratuito, sin tarjeta). Opcional: puedes crear los dos servicios a mano (ver docs/despliegue-render-neon.md).
# Sin credenciales aquí: las variables marcadas sync:false las escribes tú en el panel de Render.
services:
  - type: web
    name: fitona-api
    runtime: docker
    plan: free
    branch: claude-v1
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: .
    healthCheckPath: /q/health/live   # liveness: no toca la BD (así Neon puede dormirse)
    envVars:
      - { key: FITONA_DB_KIND, value: postgresql }
      - { key: FITONA_DB_INIT_SQL, value: SELECT 1 }
      - { key: FITONA_DB_POOL_MAX, value: "3" }
      - { key: FITONA_REGISTRATION_OPEN, value: "true" }   # ponlo en false cuando hayas creado tus cuentas
      - { key: FITONA_CORS_ENABLED, value: "true" }
      - { key: JAVA_OPTS, value: "-Xms32m -Xmx256m -XX:MaxMetaspaceSize=128m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError" }
      - { key: FITONA_DB_URL, sync: false }          # jdbc:postgresql://HOST/DB?sslmode=require
      - { key: FITONA_DB_USER, sync: false }         # fitona_app
      - { key: FITONA_DB_PASSWORD, sync: false }
      - { key: FITONA_CORS_ORIGINS, sync: false }    # https://fitona-web.onrender.com
  - type: web
    name: fitona-web
    runtime: static
    branch: claude-v1
    rootDir: frontend
    buildCommand: |-
      npm ci && npm run build && echo "window.FITONA_CONFIG = { apiBase: '$FITONA_API_URL' };" > dist/frontend/browser/config.js
    staticPublishPath: dist/frontend/browser
    envVars:
      - { key: NODE_VERSION, value: 24.15.0 }
      - { key: FITONA_API_URL, sync: false }          # https://fitona-api.onrender.com
    routes:
      - { type: rewrite, source: /*, destination: /index.html }
    # Cabeceras. Si cambias la URL del backend, actualiza también connect-src de la política CSP.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://fitona-backend.onrender.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - { path: /*, name: X-Content-Type-Options, value: nosniff }
      - { path: /*, name: Referrer-Policy, value: no-referrer }
      - { path: /*, name: X-Frame-Options, value: DENY }
      - { path: /*, name: Permissions-Policy, value: "camera=(), microphone=(), geolocation=(), payment=()" }
      # Service worker y configuración: nunca en caché (así las versiones nuevas llegan siempre).
      - { path: /ngsw-worker.js, name: Cache-Control, value: no-cache }
      - { path: /safety-worker.js, name: Cache-Control, value: no-cache }
      - { path: /ngsw.json, name: Cache-Control, value: no-cache }
      - { path: /config.js, name: Cache-Control, value: no-cache }
      - { path: /index.html, name: Cache-Control, value: no-cache }
      - { path: /manifest.webmanifest, name: Cache-Control, value: no-cache }

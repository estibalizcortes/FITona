server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/security-headers.inc;

  # La API vive en el backend (no se expone a Internet por separado).
  location /api/ {
    include /etc/nginx/security-headers.inc;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
  }

  # Service worker y su lista de versiones: NUNCA en caché (si no, la gente se queda con una versión antigua).
  location = /ngsw-worker.js { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /safety-worker.js { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /ngsw.json { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Configuración de despliegue: nunca en caché.
  location = /config.js { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri =404; }

  # Iconos y pantallas de inicio: nombre fijo, caché corta (un día).
  location ^~ /icons/ { include /etc/nginx/security-headers.inc; expires 1d; try_files $uri =404; }
  location ^~ /splash/ { include /etc/nginx/security-headers.inc; expires 1d; try_files $uri =404; }

  # Archivos con hash: caché larga. index.html y el manifiesto: sin caché.
  location ~* \.(js|css|woff2?|png|svg|ico)$ { include /etc/nginx/security-headers.inc; expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { include /etc/nginx/security-headers.inc; add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}

# FITona · entorno local completo (Windows 11 + Docker Desktop, o Linux).
#   Todo:        docker compose up -d --build        -> http://localhost:4200
#   Solo BD:     docker compose up -d oracle && docker compose run --rm migrate
# Las credenciales se leen de .env (copiar desde .env.example). No se versiona .env.
name: fitona

services:
  oracle:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:23-slim-faststart}
    container_name: fitona-oracle
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD:?Defina ORACLE_SYS_PASSWORD en .env}
      APP_USER: FITONA_OWNER
      APP_USER_PASSWORD: ${FITONA_OWNER_PASSWORD:?Defina FITONA_OWNER_PASSWORD en .env}
      FITONA_APP_PASSWORD: ${FITONA_APP_PASSWORD:?Defina FITONA_APP_PASSWORD en .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/provisioning:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Aplica las migraciones Flyway como propietario del esquema y termina.
  migrate:
    image: ${FLYWAY_IMAGE:-flyway/flyway:13.12.2}
    depends_on:
      oracle:
        condition: service_healthy
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: >
      -url=jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      -user=FITONA_OWNER
      -password=${FITONA_OWNER_PASSWORD}
      -locations=filesystem:/flyway/sql
      migrate
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre}
    image: fitona-backend:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      FITONA_DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      FITONA_DB_USER: FITONA_APP
      FITONA_DB_PASSWORD: ${FITONA_APP_PASSWORD}
      # Solo para pruebas internas: acepta la cabecera X-Dev-User sin contraseña. Dejar en false.
      FITONA_AUTH_DEV_ENABLED: ${FITONA_AUTH_DEV_ENABLED:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    image: fitona-frontend:dev
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:80"
    restart: unless-stopped

volumes:
  oracle-data:

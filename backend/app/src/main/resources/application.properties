# FITona backend. Valores por defecto NO sensibles; las credenciales vienen del entorno.
# Render inyecta PORT; en local es 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=2M

# Base de datos: la aplicación se conecta como FITONA_APP (sin DDL) y trabaja sobre el esquema del propietario.
# Oracle (local, por defecto) o PostgreSQL (Render + Neon): db-kind se fija al COMPILAR (ver backend/Dockerfile, ARG DB_KIND).
quarkus.datasource.db-kind=${FITONA_DB_KIND:oracle}
quarkus.datasource.jdbc.url=${FITONA_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
quarkus.datasource.username=${FITONA_DB_USER:FITONA_APP}
quarkus.datasource.password=${FITONA_DB_PASSWORD}
# Oracle: fijar el esquema del propietario. PostgreSQL: FITONA_DB_INIT_SQL="SELECT 1" (usa el esquema public).
quarkus.datasource.jdbc.new-connection-sql=${FITONA_DB_INIT_SQL:ALTER SESSION SET CURRENT_SCHEMA = ${FITONA_DB_SCHEMA:FITONA_OWNER}}
quarkus.datasource.jdbc.max-size=${FITONA_DB_POOL_MAX:10}
quarkus.datasource.jdbc.min-size=0
quarkus.datasource.jdbc.idle-removal-interval=60S
quarkus.datasource.jdbc.max-lifetime=10M

# Autenticación: cuentas con correo y contraseña (/api/v1/auth/*, token Bearer). La cabecera X-Dev-User (sin seguridad)
# solo se acepta con fitona.auth.dev-enabled=true: NUNCA activarla en un servidor accesible desde internet.
fitona.auth.dev-enabled=${FITONA_AUTH_DEV_ENABLED:false}
# Coste del hash de contraseñas nuevas (OWASP: 600000). En servidores muy pequeños (0,1 CPU) bajarlo, p. ej. 100000.
fitona.auth.pbkdf2-iterations=${FITONA_PBKDF2_ITERATIONS:600000}
# false = nadie puede crear cuentas nuevas (ciérralo tras crear las tuyas si la app es pública).
fitona.auth.registration-open=${FITONA_REGISTRATION_OPEN:true}

quarkus.smallrye-openapi.info-title=FITona API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.path=/q/openapi
# Swagger UI solo en desarrollo (por defecto no se incluye en el contenedor de producción).

quarkus.log.category."es.fitona".level=INFO
%test.fitona.auth.dev-enabled=true

# CORS: el frontend estático (otro dominio) llama a esta API con «Authorization: Bearer» (sin cookies).
# FITONA_CORS_ORIGINS = lista separada por comas, p. ej. https://fitona.onrender.com. Vacío = sin CORS (mismo origen).
quarkus.http.cors.enabled=${FITONA_CORS_ENABLED:false}
quarkus.http.cors.origins=${FITONA_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.http.cors.access-control-max-age=1H
# Sin cookies: no se necesitan credenciales de navegador en CORS.
quarkus.http.cors.access-control-allow-credentials=false

# FITona backend. Valores por defecto NO sensibles; las credenciales vienen del entorno.
quarkus.http.port=8080
quarkus.http.limits.max-body-size=2M

# Base de datos: la aplicación se conecta como FITONA_APP (sin DDL) y trabaja sobre el esquema del propietario.
quarkus.datasource.db-kind=oracle
quarkus.datasource.jdbc.url=${FITONA_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
quarkus.datasource.username=${FITONA_DB_USER:FITONA_APP}
quarkus.datasource.password=${FITONA_DB_PASSWORD}
quarkus.datasource.jdbc.new-connection-sql=ALTER SESSION SET CURRENT_SCHEMA = ${FITONA_DB_SCHEMA:FITONA_OWNER}
quarkus.datasource.jdbc.max-size=10

# Autenticación: cuentas con correo y contraseña (/api/v1/auth/*, token Bearer). La cabecera X-Dev-User (sin seguridad)
# solo se acepta con fitona.auth.dev-enabled=true: NUNCA activarla en un servidor accesible desde internet.
fitona.auth.dev-enabled=${FITONA_AUTH_DEV_ENABLED:false}

quarkus.smallrye-openapi.info-title=FITona API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.path=/q/openapi
# Swagger UI solo en desarrollo (por defecto no se incluye en el contenedor de producción).

quarkus.log.category."es.fitona".level=INFO
%test.fitona.auth.dev-enabled=true
